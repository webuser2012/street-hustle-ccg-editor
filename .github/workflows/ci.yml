name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test deps
        run: pip install pytest

      - name: Validate card data + schema
        run: python3 scripts/validate_db.py --data-dir data

      - name: Run unit tests
        run: python3 -m pytest tests/ -q